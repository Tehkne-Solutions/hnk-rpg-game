name: HNK AFTERWORLD Web-first Gate
on:
  workflow_dispatch:
  pull_request:

jobs:
  canonical-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate AF-001AC contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('contracts/AF001AC_WEB_VEGETATION_OPTIMIZATION_CONTRACT.json', encoding='utf-8'))
          assert p['signature']=='Tehkné Solutions'
          assert p['logical_object_count']>=600
          assert p['runtime_budget']['target_fps']>=55
          print('AF-001AC contract PASS')
          PY

  asset-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce no committed GLB assets in game repo
        run: |
          if find . -type f -name '*.glb' | grep -q .; then
            echo 'GLB belongs in Tehkne-Solutions/hnk-rpg-game-assets' >&2
            exit 1
          fi
          echo 'asset boundary PASS'
