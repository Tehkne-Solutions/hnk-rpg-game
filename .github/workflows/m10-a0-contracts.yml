name: M10-A0 Contracts

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/m10-a0-architecture-bootstrap

jobs:
  bootstrap-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate architecture bootstrap
        run: python tools/validate_bootstrap.py
