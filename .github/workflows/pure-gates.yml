name: Pure Runtime Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pure-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic pure runtime gates
        run: npm run test:pure
